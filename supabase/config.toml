# supabase/config.toml — برای Supabase CLI
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation = { enabled = true }

[auth]
enabled = true
port = 54325
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:8000", "https://your-username.github.io"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
external_email_enabled = true
external_anonymous_users_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false
